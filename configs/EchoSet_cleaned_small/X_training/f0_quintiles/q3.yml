audionet:
  audionet_name: TIGER
  audionet_config:
    out_channels: 128
    in_channels: 256
    num_blocks: 4
    upsampling_depth: 5
    win: 640
    stride: 160
    num_sources: 2
loss:
  train:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_snr
    config:
      pit_from: pw_mtx
      threshold_byloss: false
  val:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr
    config:
      pit_from: pw_mtx
      threshold_byloss: false
training:
  system: AudioLightningModule
  num_nodes: 3
  gpus: 1
  parallel: ddp
  epochs: 500
  early_stop:
    monitor: val_loss/dataloader_idx_0
    mode: min
    patience: 75
    verbose: true
  SpeedAug: false
optimizer:
  optim_name: adam
  lr: 0.001
  weight_decay: 0
scheduler:
  sche_name: ReduceLROnPlateau
  sche_config:
    patience: 25
    factor: 0.5
datamodule:
  data_name: EchoSetDataModule
  data_config:
    train_dir: DataPreProcess/EchoSet_cleaned_small/rankings/F0semitoneFrom27.5Hz_sma3nz_amean
    valid_dir: DataPreProcess/EchoSet_cleaned_small/val
    test_dir: DataPreProcess/EchoSet_cleaned_small/test
    subset_range:
    - 0.4
    - 0.6
    n_src: 2
    sample_rate: 16000
    segment: 2.0
    normalize_audio: false
    batch_size: 2
    num_workers: 2
    pin_memory: true
    persistent_workers: true
exp:
  exp_name: TIGER-EchoSet_cleaned_small-quintile3_3_gpus_X_11_11_snr_fixed
