# Network config
audionet:
  audionet_name: TIGER
  audionet_config:
    out_channels: 128
    in_channels: 256
    num_blocks: 4
    upsampling_depth: 5
    win: 1280
    stride: 320
    num_sources: 2
    frequency_split: high_f0_split

# Loss config
loss:
  train:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_snr
    config:
      pit_from: pw_mtx
      threshold_byloss: false
  val:
    loss_func: PITLossWrapper
    sdr_type: pairwise_neg_sisdr
    config:
      pit_from: pw_mtx
      threshold_byloss: false

# Training config
training:
  system: AudioLightningModule
  gpus: [0]
  parallel: ddp
  epochs: 50
  early_stop:
    monitor: val_loss/dataloader_idx_0
    mode: min
    patience: 10
    verbose: true
  SpeedAug: False
  
# Optim config
optimizer:
  optim_name: adam
  lr: 0.001
  weight_decay: 0

# Sche config
scheduler: 
  sche_name: ReduceLROnPlateau
  sche_config:
    patience: 10
    factor: 0.5

# Data config
datamodule:
  data_name: EchoSetDataModule
  data_config:
    train_dir: /idiap/home/adubois/project_ma1/TIGER/DataPreProcess/EchoSet_1:10/train
    valid_dir: /idiap/home/adubois/project_ma1/TIGER/DataPreProcess/EchoSet_1:10/val
    test_dir: /idiap/home/adubois/project_ma1/TIGER/DataPreProcess/EchoSet_1:10/test
    n_src: 2
    sample_rate: 16000
    segment: 4.0
    normalize_audio: false
    batch_size: 1
    num_workers: 1
    pin_memory: true
    persistent_workers: false

exp:
  exp_name: TIGER-EchoSet-1:10-high_f0_split-large-window
